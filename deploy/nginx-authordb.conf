# Sample Nginx config: serve the FastAPI Authorship DB at /authordb on the SAME
# origin as the wiki. Same-origin keeps the iframe and session cookie simple
# (no third-party-cookie issues). Drop this inside the wiki's `server { }` block.
#
# IMPORTANT: no trailing slash in proxy_pass — the app runs with
# ROOT_PATH=/authordb and must receive the ORIGINAL path including the
# /authordb prefix (Starlette's StaticFiles returns 404 for /static/*
# otherwise; page routes tolerate both, which hides the misconfiguration).

location /authordb/ {
    proxy_pass         http://127.0.0.1:8489;   # no trailing slash: keeps the /authordb prefix
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
