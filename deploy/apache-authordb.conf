# Sample Apache config: serve the FastAPI Authorship DB at /authordb on the SAME
# origin as the wiki. Place inside the wiki's <VirtualHost> block.
#
# Requires: a2enmod proxy proxy_http headers
#
# IMPORTANT: the backend URL ends with /authordb — the app runs with
# ROOT_PATH=/authordb and must receive the ORIGINAL path including the
# prefix (Starlette's StaticFiles returns 404 for /static/* otherwise).

<Location "/authordb">
    ProxyPass         "http://127.0.0.1:8489/authordb"
    ProxyPassReverse  "http://127.0.0.1:8489/authordb"
    RequestHeader set X-Forwarded-Proto "http"   # change to "https" once the wiki runs on TLS
</Location>
